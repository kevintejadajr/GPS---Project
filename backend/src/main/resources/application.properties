spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/siead
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

# Clave secreta JWT fija para que los tokens sean válidos entre reinicios del backend
jwt.secret=siead-secret-key-for-signing-tokens-must-be-at-least-256-bits-long

